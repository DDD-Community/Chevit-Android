android {
    compileSdkVersion Integer.parseInt(project.compileSdk)

    defaultConfig {
        targetSdkVersion Integer.parseInt(project.targetSdk)
        minSdkVersion Integer.parseInt(project.minSdk)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true
            consumerProguardFiles 'consumer-rules.pro'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro',
                    'proguard-fixed-r8.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation(libs.bundles.kotlin)
    implementation(libs.bundles.kotlin.coroutine)

    implementation(libs.bundles.androidx.base)
    implementation(libs.bundles.androidx.lifecycle)

    implementation(libs.logger.timber)
}
