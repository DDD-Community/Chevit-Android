[versions]
# Plugin
ksp = "2.0.21-1.0.28"
androidGradlePlugin = "8.2.2"

# Kotlin
kotlin = "2.0.21"
coroutines = "1.9.0"

# AndroidX
ktx = "1.13.1"
lifecycle = "2.8.7"
appCompat = "1.7.0"
activity = "1.9.3"
fragment = "1.8.5"
recyclerView = "1.3.2"
navigation = "2.7.6"
startup = "1.2.0"
play-services-auth = "20.7.0"
data-store = "1.0.0"
material = "1.12.0"
protobuf-plugin = "0.9.4"
protobuf = "3.25.2"
browser = "1.8.0"
lifecycleProcess = "2.7.0"

# Firebase
google-services = "4.4.0"
firebase-crashlytics = "2.9.9"
firebase-performance = "1.4.2"
firebase-bom = "33.7.0"

# Compose
compose-bom = "2024.02.00"

# DI
hilt = "2.52"
hiltExt = "1.1.0"
dagger = "2.52"

# Network
okhttp = "4.12.0"
retrofit = "2.11.0"
chucker = "4.1.0"

# Coil
coil = "2.7.0"
coil-compose = "2.7.0"

# Lottie
lottie-compose = "6.6.0"

# Logger
timber = "5.0.1"
junit = "4.13.2"
androidx-test-ext-junit = "1.1.5"
espresso-core = "3.5.1"

[libraries]
#Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlin-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlin-coroutines-jvm = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core-jvm", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version = "1.6.2" }

#AndroidX
androidx-ktx = { module = "androidx.core:core-ktx", version.ref = "ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appCompat" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-constraintLayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.1.4" }
androidx-recyclerView = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerView" }
androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "startup" }
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "data-store" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleProcess" }

#Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version = "1.2.0" }
compose-uiGraphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-uiTooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-uiToolingPreview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-test-uiManifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-test-ui = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-viewModel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-hiltViewModel = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.1.0" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics-ktx" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics-ktx" }
firebase-performance = { module = "com.google.firebase:firebase-perf-ktx" }
firebase-auth = { module = "com.google.firebase:firebase-auth-ktx" }
playservices-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "play-services-auth" }

#Navigation
androidx-navigation-ui = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
androidx-navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-runtime = { group = "androidx.navigation", name = "navigation-runtime-ktx", version.ref = "navigation" }

#Lifecycle
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }

#OkHttp
okhttp-core = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-test = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

#Retrofit
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-coroutines = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlin-coroutines-adapter", version = "0.9.2" }
retrofit-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version = "1.0.0" }

#Chucker
chucker-debug = { group = "com.github.chuckerteam.chucker", name = "library", version.ref = "chucker" }

#Dagger
dagger-core = { group = "com.google.dagger", name = "dagger", version.ref = "dagger" }
dagger-compiler = { group = "com.google.dagger", name = "dagger-compiler", version.ref = "dagger" }

#Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-ext-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltExt" }
hilt-ext-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltExt" }

#Coil
coil-core = { group = "io.coil-kt", name = "coil", version.ref = "coil" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil-compose" }

#Lottie
lottie-compose = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie-compose" }

#Logger
logger-timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }

#Protobug
protobuf-kotlin-lite = { group = "com.google.protobuf", name = "protobuf-kotlin-lite", version.ref = "protobuf" }
protobuf-java-lite = { group = "com.google.protobuf", name = "protobuf-javalite", version.ref = "protobuf" }
protobuf-protoc = { group = "com.google.protobuf", name = "protoc", version.ref = "protobuf" }

## classpath
classpath-kotlin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
classpath-protobuf = { group = "com.google.protobuf", name = "protobuf-gradle-plugin", version.ref = "protobuf-plugin" }

[plugins]
com-android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
com-android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
com-android-test = { id = "com.android.test", version.ref = "androidGradlePlugin" }
com-google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
com-google-protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }

google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics" }
firebase-performance = { id = "com.google.firebase.firebase-perf", version.ref = "firebase-performance" }

org-jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
org-jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
org-jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

com-google-dagger-hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

com-androidx-navigation-safeArgs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }

[bundles]
kotlin = [
    "kotlin-stdlib",
    "kotlin-coroutines"
]

kotlin-coroutine = [
    "kotlin-coroutines",
    "kotlin-coroutines-android",
    "kotlin-coroutines-jvm"
]

androidx-base = [
    "androidx-ktx",
    "androidx-activity",
    "androidx-fragment",
    "androidx-appcompat",
    "androidx-constraintLayout",
    "androidx-recyclerView",
    "androidx-material"
]

androidx-lifecycle = [
    "androidx-lifecycle-runtime",
    "androidx-lifecycle-viewmodel",
    "androidx-lifecycle-savedstate"
]

androidx-navigation = [
    "androidx-navigation-fragment",
    "androidx-navigation-runtime",
    "androidx-navigation-ui"
]

compose = [
    "compose-bom",
    "compose-ui",
    "compose-activity",
    "compose-material3",
    "compose-uiGraphics",
    "compose-uiTooling",
    "compose-uiToolingPreview",
    "compose-test-uiManifest",
    "compose-test-ui",
    "compose-viewModel",
    "compose-hiltViewModel",
]

okhttp = [
    "okhttp-core"
]

okhttp-debug = [
    "okhttp-logging",
    "okhttp-test"
]

retrofit = [
    "retrofit-core",
    "retrofit-coroutines",
    "retrofit-serialization"
]

protobuf = [
    "androidx-datastore",
    "protobuf-kotlin-lite",
    "protobuf-java-lite",
    "protobuf-protoc"
]
